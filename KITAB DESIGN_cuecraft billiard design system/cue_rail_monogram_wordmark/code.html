<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40" fill="none">
  <!-- Minimal geometric monogram emblem: precision diamond sightline and cue trajectory intersecting a rail -->
  <g id="mark">
    <!-- Outer rail boundary line segment -->
    <rect x="2" y="6" width="28" height="28" rx="2" stroke="#141615" stroke-width="1.75" fill="#FBF9F5" />
    <!-- Table diamond inlay marker -->
    <polygon points="16,10 20,16 16,22 12,16" fill="#0F5A47" />
    <!-- Cue trajectory sightline -->
    <line x1="8" y1="26" x2="24" y2="10" stroke="#0F5A47" stroke-width="1.75" stroke-linecap="round" />
    <circle cx="21" cy="23" r="2" fill="#141615" />
  </g>
  <!-- Wordmark -->
  <text x="38" y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" letter-spacing="0.12em" fill="#141615">CUE &amp; RAIL</text>
  <text x="38" y="30" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="500" font-size="7.5" letter-spacing="0.28em" fill="#5C625E">CLUB PLATFORM</text>
</svg>
